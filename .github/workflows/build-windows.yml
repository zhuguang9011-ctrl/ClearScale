name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ClearScale-Windows
          path: dist/*.exe
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0-beta.1
          target_commitish: ${{ github.sha }}
          name: ClearScale v1.2.0-beta.1
          prerelease: true
          body: |
            新增局部材质精修实验功能：需自行安装本机 ComfyUI、Ultimate SD Upscale 和 SD1.5 模型。
            支持框选产品、三种材质预设、低强度分块重绘；选区外不参与生成。
            使用指南：https://github.com/zhuguang9011-ctrl/ClearScale/blob/main/REFINE_GUIDE.md
            尚未完成真实 GPU 出图验证，不承诺消除塑胶感或严格保持选区内结构颜色。
            包含一键安装版（文件名带 Setup）和绿色免安装版。
          files: dist/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.exe
