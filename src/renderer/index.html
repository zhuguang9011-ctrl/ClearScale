<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob:; style-src 'self'; script-src 'self'">
  <title>ClearScale 清晰放大</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">C</span><div><strong>ClearScale</strong><small>清晰放大</small></div></div>
    <div class="privacy"><span></span>图片仅在本机处理</div>
  </header>

  <main class="workspace">
    <section class="stage">
      <div class="empty-state" id="emptyState">
        <div class="upload-icon">↗</div>
        <h1>让模糊图片重新清晰</h1>
        <p>AI 补充纹理细节，最高可放大至原图 4 倍</p>
        <button class="primary large" id="pickButton">选择图片</button>
        <span>支持 JPG、PNG、WebP · 可批量选择</span>
      </div>

      <div class="preview hidden" id="preview">
        <div class="preview-toolbar">
          <div><strong id="fileName">图片预览</strong><span id="fileMeta"></span></div>
          <button class="ghost" id="replaceButton">重新选择</button>
        </div>
        <div class="compare" id="compare">
          <img id="afterImage" alt="高清处理后">
          <div class="before-layer" id="beforeLayer"><img id="beforeImage" alt="原图"></div>
          <div class="divider" id="divider"><span>↔</span></div>
          <span class="tag before">原图</span><span class="tag after">高清后</span>
        </div>
        <div class="queue" id="queue"></div>
      </div>
    </section>

    <aside class="settings">
      <div class="settings-head"><h2>高清设置</h2><span class="status" id="engineStatus">检测引擎…</span></div>

      <fieldset><legend>图片类型</legend>
        <label class="option active"><input type="radio" name="model" value="general" checked><span class="option-icon">▧</span><span><strong>照片 / 产品图</strong><small>保留真实纹理与边缘</small></span><i>✓</i></label>
        <label class="option"><input type="radio" name="model" value="anime"><span class="option-icon">◇</span><span><strong>插画 / 动漫</strong><small>优化线条与色块</small></span><i>✓</i></label>
      </fieldset>

      <fieldset><legend>放大倍率</legend>
        <div class="segmented" id="scaleGroup"><button data-scale="2">2×</button><button data-scale="3">3×</button><button class="active" data-scale="4">4×</button></div>
        <p class="hint" id="sizeHint">输出尺寸约为原图的 4 倍</p>
      </fieldset>

      <fieldset><legend>导出格式</legend>
        <select id="format"><option value="png">PNG · 无损高清</option><option value="jpg">JPG · 文件更小</option><option value="webp">WebP · 高压缩率</option></select>
      </fieldset>

      <fieldset><legend>图片优化</legend>
        <label class="toggle-row"><span><strong>自动降噪</strong><small>减少颗粒和彩色杂点</small></span><input type="checkbox" id="denoise" checked><b></b></label>
        <p class="hint">色泽均匀优化（保留自然光影）</p>
        <select id="evenness"><option value="off">关闭</option><option value="light" selected>轻度 · 保留更多纹理</option><option value="standard">标准 · 加强表面平滑</option></select>
        <p class="hint">减轻局部杂色，不自动消除大面积光照差异。</p>
      </fieldset>
      <fieldset><legend>增强质量</legend>
        <label class="toggle-row"><span><strong>极致细节模式</strong><small>速度较慢，适合重要图片</small></span><input type="checkbox" id="tta"><b></b></label>
      </fieldset>

      <div class="output-row"><span><strong>保存到</strong><small id="outputPath">尚未选择文件夹</small></span><button class="ghost" id="folderButton">选择</button></div>
      <button class="primary action" id="startButton" disabled>开始高清放大</button>
      <button class="cancel hidden" id="cancelButton">取消任务</button>

      <div class="progress-card hidden" id="progressCard"><div><span id="progressText">准备中</span><strong id="progressPercent">0%</strong></div><div class="progress-track"><i id="progressBar"></i></div></div>
      <button class="open-result hidden" id="openFolderButton">打开导出文件夹</button>
    </aside>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
